<!DOCTYPE html>
<html>
<head>
<title>GHoST Dump</title>
<style>
  body{background:#0a0a0b;color:#eaeaea;font-family:monospace;padding:20px}
  input,button{padding:10px;font-size:14px;margin:5px;background:#141417;border:1px solid #2a2a33;color:#fff;border-radius:6px}
  button{background:#5ce1e6;color:#000;font-weight:bold;cursor:pointer}
  pre{background:#050506;border:1px solid #2a2a33;border-radius:8px;padding:15px;overflow:auto;max-height:70vh;white-space:pre-wrap;word-break:break-all;font-size:12px;line-height:1.5}
  .box{margin-bottom:15px}
</style>
</head>
<body>
<h2 style="color:#5ce1e6">GHoST · Firebase Dump</h2>
<div class="box">
  <input id="u" placeholder="Firebase URL" size="45">
  <input id="k" placeholder="Key" size="35">
  <button onclick="go()">DUMP</button>
</div>
<pre id="out">Waiting...</pre>
<script>
async function go(){
  const u = document.getElementById('u').value.trim().replace(/\/+$/,'');
  const k = document.getElementById('k').value.trim();
  const o = document.getElementById('out');
  if(!u || !k){ o.textContent = 'Enter URL and key'; return; }
  o.textContent = 'Loading...';
  try {
    const r = await fetch(u + '/clients.json?auth=' + encodeURIComponent(k));
    const d = await r.json();
    const keys = Object.keys(d || {});
    if(!keys.length){ o.textContent = 'Empty /clients'; return; }
    const first = d[keys[0]];
    o.textContent = '━━━ TOP-LEVEL KEYS (first device) ━━━\n\n'
      + Object.keys(first).join('\n')
      + '\n\n━━━ FULL FIRST DEVICE JSON ━━━\n\n'
      + JSON.stringify(first, null, 2)
      + '\n\n━━━ FIRST DEVICE ID ━━━\n\n' + keys[0]
      + '\n\n━━━ TOTAL DEVICES ━━━\n\n' + keys.length;
  } catch(e){
    o.textContent = 'ERROR: ' + e.message;
  }
}
</script>
</body>
</html>
