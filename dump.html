<!DOCTYPE html>
<html>
<head>
<title>GHoST Dump v2</title>
<style>
  body{background:#0a0a0b;color:#eaeaea;font-family:monospace;padding:20px}
  input,button{padding:10px;font-size:14px;margin:5px;background:#141417;border:1px solid #2a2a33;color:#fff;border-radius:6px}
  button{background:#5ce1e6;color:#000;font-weight:bold;cursor:pointer}
  pre{background:#050506;border:1px solid #2a2a33;border-radius:8px;padding:15px;overflow:auto;max-height:75vh;white-space:pre-wrap;word-break:break-all;font-size:12px;line-height:1.5}
  .box{margin-bottom:15px}
  h3{color:#5ce1e6;margin-top:20px;border-bottom:1px solid #2a2a33;padding-bottom:5px}
</style>
</head>
<body>
<h2 style="color:#5ce1e6">GHoST · Firebase Dump v2</h2>
<div class="box">
  <input id="u" placeholder="Firebase URL" size="45">
  <input id="k" placeholder="Key" size="35">
  <button onclick="go()">DUMP</button>
</div>
<pre id="out">Waiting...</pre>
<script>
async function go(){
  const u = document.getElementById('u').value.trim().replace(/\/+$/,'');
  const k = document.getElementById('k').value.trim();
  const o = document.getElementById('out');
  if(!u || !k){ o.textContent = 'Enter URL and key'; return; }
  o.textContent = 'Loading...';
  const auth = '?auth=' + encodeURIComponent(k);
  let out = '';

  try {
    // 1. ROOT — what top-level nodes exist?
    out += '━━━ ROOT NODES (all top-level keys) ━━━\n\n';
    try {
      const r = await fetch(u + '/.json?shallow=true&' + auth.slice(1));
      const d = await r.json();
      if(d && typeof d === 'object'){
        out += Object.keys(d).join('\n') + '\n\n';
      } else {
        out += '(no shallow support, trying full)\n';
        const r2 = await fetch(u + '/.json' + auth);
        const d2 = await r2.json();
        out += Object.keys(d2 || {}).join('\n') + '\n\n';
      }
    } catch(e){ out += 'root error: ' + e.message + '\n\n'; }

    // 2. Get first device ID from clients
    out += '━━━ FETCHING FIRST DEVICE ID ━━━\n\n';
    const rc = await fetch(u + '/clients.json?shallow=true&' + auth.slice(1));
    const clients = await rc.json();
    const firstId = clients ? Object.keys(clients)[0] : null;
    if(!firstId){ o.textContent = out + 'No devices found'; return; }
    out += 'First device: ' + firstId + '\n\n';

    // 3. Check every plausible sub-path for that device
    const paths = [
      'clients/' + firstId + '/info',
      'clients/' + firstId + '/device',
      'clients/' + firstId + '/details',
      'clients/' + firstId + '/data',
      'clients/' + firstId + '/profile',
      'clients/' + firstId + '/sim',
      'clients/' + firstId + '/sims',
      'clients/' + firstId + '/phone',
      'clients/' + firstId + '/user',
      'clients/' + firstId + '/meta',
      'devices/' + firstId,
      'info/' + firstId,
      'phones/' + firstId,
      'users/' + firstId
    ];

    out += '━━━ CHECKING SUB-PATHS ━━━\n\n';
    for(const p of paths){
      try {
        const r = await fetch(u + '/' + p + '.json' + auth);
        const d = await r.json();
        if(d !== null && d !== undefined){
          out += '✓ ' + p + ' → has data:\n';
          out += JSON.stringify(d, null, 2).slice(0, 800) + '\n\n';
        }
      } catch(e){}
    }

    // 4. Messages for first device
    out += '━━━ MESSAGES FOR FIRST DEVICE ━━━\n\n';
    try {
      const rm = await fetch(u + '/messages/' + firstId + '.json?limitToLast=2&' + auth.slice(1));
      const msgs = await rm.json();
      if(msgs && typeof msgs === 'object'){
        out += 'Message count (last 2): ' + Object.keys(msgs).length + '\n\n';
        out += JSON.stringify(msgs, null, 2).slice(0, 1500) + '\n';
      } else {
        out += 'No messages or empty\n';
      }
    } catch(e){ out += 'messages error: ' + e.message + '\n'; }

    // 5. Root full scan (top-level values, shallow, small)
    out += '\n━━━ ROOT DEEP SCAN (each top node preview) ━━━\n\n';
    try {
      const r = await fetch(u + '/.json' + auth);
      const full = await r.json();
      if(full && typeof full === 'object'){
        for(const key of Object.keys(full)){
          const val = full[key];
          let preview = '';
          if(Array.isArray(val)) preview = '[array len=' + val.length + ']';
          else if(val && typeof val === 'object'){
            const sub = Object.keys(val);
            preview = '{object keys=' + sub.length + ': ' + sub.slice(0,5).join(', ') + (sub.length > 5 ? '...' : '') + '}';
          } else preview = String(val).slice(0, 100);
          out += key + ' → ' + preview + '\n';
        }
      }
    } catch(e){ out += 'deep error: ' + e.message + '\n'; }

    o.textContent = out;
  } catch(e){
    o.textContent = out + '\n\nFATAL: ' + e.message;
  }
}
</script>
</body>
</html>
