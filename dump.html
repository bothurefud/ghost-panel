<!DOCTYPE html>
<html>
<head>
<title>GHoST Dump v3</title>
<style>
  body{background:#0a0a0b;color:#eaeaea;font-family:monospace;padding:20px}
  input,button{padding:10px;font-size:14px;margin:5px;background:#141417;border:1px solid #2a2a33;color:#fff;border-radius:6px}
  button{background:#5ce1e6;color:#000;font-weight:bold;cursor:pointer}
  pre{background:#050506;border:1px solid #2a2a33;border-radius:8px;padding:15px;overflow:auto;max-height:78vh;white-space:pre-wrap;word-break:break-all;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<h2 style="color:#5ce1e6">GHoST · Dump v3</h2>
<div>
  <input id="u" placeholder="Firebase URL" size="45">
  <input id="k" placeholder="Key" size="35">
  <button onclick="go()">DUMP</button>
</div>
<pre id="out">Waiting...</pre>
<script>
async function go(){
  const u = document.getElementById('u').value.trim().replace(/\/+$/,'');
  const k = document.getElementById('k').value.trim();
  const o = document.getElementById('out');
  if(!u || !k){ o.textContent = 'Enter URL and key'; return; }
  o.textContent = 'Loading...';
  const auth = 'auth=' + encodeURIComponent(k);
  let out = '';

  try {
    // Get all device IDs
    const rc = await fetch(u + '/clients.json?shallow=true&' + auth);
    const clients = await rc.json();
    const ids = clients ? Object.keys(clients) : [];
    out += '━━━ TOTAL DEVICES: ' + ids.length + ' ━━━\n\n';

    // Full JSON of first 5 devices
    out += '━━━ FULL JSON OF FIRST 5 DEVICES ━━━\n\n';
    for(let i = 0; i < Math.min(5, ids.length); i++){
      const id = ids[i];
      try {
        const r = await fetch(u + '/clients/' + id + '.json?' + auth);
        const d = await r.json();
        out += '▸ Device ' + (i+1) + ': ' + id + '\n';
        out += JSON.stringify(d, null, 2).slice(0, 1500) + '\n\n';
      } catch(e){ out += 'err ' + id + ': ' + e.message + '\n'; }
    }

    // Messages for first device — different query approach
    out += '━━━ MESSAGES — FIRST DEVICE ━━━\n\n';
    const fid = ids[0];
    try {
      // no query params, just limitToLast needs orderBy on key
      const r = await fetch(u + '/messages/' + fid + '.json?' + auth);
      const d = await r.json();
      if(d && typeof d === 'object'){
        const keys = Object.keys(d);
        out += 'Message keys count: ' + keys.length + '\n\n';
        // Show first 3 messages full
        for(let i = 0; i < Math.min(3, keys.length); i++){
          out += '▸ msg ' + (i+1) + ':\n';
          out += JSON.stringify(d[keys[i]], null, 2) + '\n\n';
        }
        // Union of all field names across all messages
        const fieldSet = new Set();
        for(const kk of keys){
          const v = d[kk];
          if(v && typeof v === 'object'){
            Object.keys(v).forEach(f => fieldSet.add(f));
          }
        }
        out += '━━━ ALL FIELD NAMES IN MESSAGES ━━━\n';
        out += [...fieldSet].join('\n') + '\n\n';
      } else {
        out += 'No messages for first device\n\n';
      }
    } catch(e){ out += 'messages error: ' + e.message + '\n\n'; }

    // Find a device with messages — check first 10 devices
    out += '━━━ HUNT: device with most messages (first 10 scanned) ━━━\n\n';
    for(let i = 0; i < Math.min(10, ids.length); i++){
      const id = ids[i];
      try {
        const r = await fetch(u + '/messages/' + id + '.json?shallow=true&' + auth);
        const d = await r.json();
        const c = d ? Object.keys(d).length : 0;
        if(c > 0){
          out += '✓ ' + id + ' → ' + c + ' messages\n';
          // fetch one full message from this device
          const r2 = await fetch(u + '/messages/' + id + '.json?' + auth);
          const d2 = await r2.json();
          const mk = Object.keys(d2);
          // get last msg (highest push key)
          const lastKey = mk[mk.length - 1];
          out += '\nSAMPLE MESSAGE from ' + id + ':\n';
          out += JSON.stringify(d2[lastKey], null, 2) + '\n\n';
        }
      } catch(e){}
    }

    o.textContent = out;
  } catch(e){
    o.textContent = out + '\n\nFATAL: ' + e.message;
  }
}
</script>
</body>
</html>
